aid: aerospacelab
name: Aerospacelab
description: 'Aerospacelab is a vertically integrated satellite manufacturer headquartered
  in Mont-Saint-Guibert, Belgium, founded in 2018 by Benoit Deper. The company designs,
  builds, tests and operates small-to-medium satellites — its Versatile Satellite Platform
  (VSP-50, VSP-150, VSP-300) family plus mission-specific payloads spanning very-high-resolution
  and multispectral/hyperspectral Earth observation, synthetic aperture radar, radio-frequency
  sensing, and narrowband/broadband telecommunications — for commercial, institutional
  and government customers, with an explicitly ITAR-free European supply chain. It
  is roughly 90% vertically integrated across platforms, payloads, avionics and subsystems,
  has flown eight satellites in under three years, acquired Belgian space-optics firm
  AMOS, and is building a European satellite megafactory targeting 500 satellites per
  year. Aerospacelab publishes no public developer program, API documentation or machine-readable
  API contract; its programmatic surfaces (mission control, tasking, image-processing
  pipeline and data platform built under the ESA InCubed MultiSpectral Companion Mission)
  are delivered to contracted mission customers rather than to self-serve developers.'
